<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message for Anjana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff4e50, #f9d423, #e35d5b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Container */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            z-index: 10;
            position: relative;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            line-height: 1.3;
        }

        .name-tag {
            color: #ffe3e3;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 2rem;
            height: 60px;
            align-items: center;
            position: relative;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            outline: 2px solid transparent;
        }

        button:focus {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background: #ffffff;
            color: #ff3366;
        }

        #yesBtn:hover {
            background: #ff3366;
            color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: absolute;
        }

        #noBtn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .signature {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            font-style: italic;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        /* Floating background elements */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            pointer-events: none;
            animation: flyUp 8s linear infinite;
            bottom: -50px;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Celebration Screen */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 78, 80, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .celebration.active {
            opacity: 1;
            pointer-events: all;
        }

        .celebration h2 {
            color: #ffffff;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }

        .celebration p {
            color: #ffffff;
            font-size: 1.2rem;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .falling-heart {
            position: absolute;
            color: #ffffff;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .card {
                padding: 2rem 1.5rem;
                max-width: 90%;
            }

            h1 {
                font-size: 1.8rem;
            }

            .name-tag {
                font-size: 1.2rem;
            }

            button {
                padding: 10px 25px;
                font-size: 1rem;
            }

            .celebration h2 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .name-tag {
                font-size: 1rem;
            }

            button {
                padding: 8px 20px;
                font-size: 0.9rem;
            }

            .celebration h2 {
                font-size: 1.5rem;
            }

            .celebration p {
                font-size: 1rem;
            }
        }

        /* Skip to content link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: white;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Background Floating Hearts -->
    <div id="bgHeartsContainer" aria-hidden="true"></div>

    <!-- Main Card -->
    <main id="main-content" class="card" role="main">
        <div class="name-tag">Hey Anjana... ✨</div>
        <h1>❤️ Will You Become My Girlfriend? ❤️</h1>
        
        <div class="btn-container" role="group" aria-label="Proposal response buttons">
            <button id="yesBtn" aria-label="Yes, accept the proposal">YES!</button>
            <button id="noBtn" aria-label="No, decline the proposal">No</button>
        </div>

        <div class="signature">
            by your well-wisher KRISHNA ❤️‍🩹
        </div>
    </main>

    <!-- Celebration Screen -->
    <div class="celebration" id="celebrationScreen" role="alert" aria-live="polite" aria-atomic="true">
        <h2>Yay! ❤️ Anjana said YES! 🎉</h2>
        <p>You've made Krishna the happiest person!</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const celebrationScreen = document.getElementById('celebrationScreen');
        const bgHeartsContainer = document.getElementById('bgHeartsContainer');

        // Initially position the No button to the right side of the container
        noBtn.style.left = "calc(50% + 20px)";

        // Dodge logic for the No Button
        function moveNoButton() {
            const card = document.querySelector('.card');
            const padding = 20;
            
            // Generate coordinates within the boundaries of the card
            const maxX = Math.max(0, card.clientWidth - noBtn.clientWidth - padding);
            const maxY = Math.max(0, card.clientHeight - noBtn.clientHeight - padding);
            
            // Calculate relative offset from card top/left to keep it inside the glass container safely
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * (maxY - 100)) + 50; // Keep away from exact edges

            noBtn.style.position = 'absolute';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // Keyboard navigation for No button
        noBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                moveNoButton();
            }
        });

        // Yes Button Action
        yesBtn.addEventListener('click', () => {
            celebrationScreen.classList.add('active');
            startFallingHearts();
        });

        // Generate Idle Background Hearts
        function createBgHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.setAttribute('aria-hidden', 'true');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            bgHeartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }
        setInterval(createBgHeart, 400);

        // Full Screen Falling Hearts Celebration
        function startFallingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('falling-heart');
                heart.setAttribute('aria-hidden', 'true');
                const heartTypes = ['❤️', '💖', '💝', '💕', '💘'];
                heart.innerHTML = heartTypes[Math.floor(Math.random() * heartTypes.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                celebrationScreen.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 80);
        }
    </script>
</body>
</html>
